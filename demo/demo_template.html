<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>elegant-md-renderer demo</title>

    {{MATHJAX_CSS}}

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap">

    <!-- 文章通用样式（始终生效） -->
    <link rel="stylesheet" href="styles/general.css">

    <!-- highlight.js 主题：浅色 / 深色，与主题同步切换 -->
    <link rel="stylesheet" id="hljsLight" href="styles/stackoverflow-light.min.css" media="not all">
    <link rel="stylesheet" id="hljsDark" href="styles/stackoverflow-dark.min.css" media="all">

    <!-- 主题：浅色 / 深色 -->
    <link rel="stylesheet" id="themeLight" href="styles/light.css" media="not all">
    <link rel="stylesheet" id="themeDark" href="styles/dark.css" media="all">

    <!-- 展示页专属样式 -->
    <link rel="stylesheet" href="styles/showcase.css">
</head>
<body>
    <header class="showcase-header">
        <h1>elegant-md-renderer demo</h1>
        <button id="theme-toggle" aria-label="切换主题">
            <svg viewBox="0 0 16 16"><path d="M9.598 1.591a.75.75 0 01.785-.175 7 7 0 11-8.967 8.967.75.75 0 01.961-.96 5.5 5.5 0 007.046-7.046.75.75 0 01.175-.786zm1.616 1.945a7 7 0 01-7.678 7.678 5.5 5.5 0 107.678-7.678z"></path></svg>
        </button>
    </header>
    <div class="container">
        <div class="source-panel">
            <div class="panel-title">源文件</div>
            <div class="panel-scroll"><pre><code>{{SOURCE}}</code></pre></div>
        </div>
        <div class="render-panel">
            <div class="panel-title">渲染效果</div>
            <div class="panel-scroll"><article class="post-body">{{CONTENT}}</article></div>
        </div>
    </div>

{{MERMAID_SCRIPT}}

<script>
    // ── 主题切换（与博客一致，默认深色） ──────────────────
    const lightSheet = document.getElementById('themeLight');
    const darkSheet = document.getElementById('themeDark');
    const hljsLight = document.getElementById('hljsLight');
    const hljsDark = document.getElementById('hljsDark');
    const themeToggle = document.getElementById('theme-toggle');

    const sunPath = "M8 10.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM8 12a4 4 0 100-8 4 4 0 000 8zM8 0a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0V.75A.75.75 0 018 0zm0 13a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 018 13zM2.343 2.343a.75.75 0 011.061 0l1.06 1.061a.75.75 0 01-1.06 1.06l-1.06-1.06a.75.75 0 010-1.06zm9.193 9.193a.75.75 0 011.06 0l1.061 1.06a.75.75 0 01-1.06 1.061l-1.061-1.06a.75.75 0 010-1.061zM16 8a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 0116 8zM3 8a.75.75 0 01-.75.75H.75a.75.75 0 010-1.5h1.5A.75.75 0 013 8zm10.657-5.657a.75.75 0 010 1.061l-1.061 1.06a.75.75 0 11-1.06-1.06l1.06-1.06a.75.75 0 011.06 0zm-9.193 9.193a.75.75 0 010 1.06l-1.06 1.061a.75.75 0 11-1.061-1.06l1.06-1.061a.75.75 0 011.061 0z";
    const moonPath = "M9.598 1.591a.75.75 0 01.785-.175 7 7 0 11-8.967 8.967.75.75 0 01.961-.96 5.5 5.5 0 007.046-7.046.75.75 0 01.175-.786zm1.616 1.945a7 7 0 01-7.678 7.678 5.5 5.5 0 107.678-7.678z";

    function setIcon(path) {
        themeToggle.querySelector('svg path').setAttribute('d', path);
    }

    const saved = localStorage.getItem('theme') || 'dark';
    if (saved === 'light') {
        lightSheet.media = 'all';
        darkSheet.media = 'not all';
        hljsLight.media = 'all';
        hljsDark.media = 'not all';
        setIcon(sunPath);
    }

    themeToggle.addEventListener('click', () => {
        const isDark = darkSheet.media === 'all';
        lightSheet.media = isDark ? 'all' : 'not all';
        darkSheet.media = isDark ? 'not all' : 'all';
        hljsLight.media = isDark ? 'all' : 'not all';
        hljsDark.media = isDark ? 'not all' : 'all';
        setIcon(isDark ? sunPath : moonPath);
        localStorage.setItem('theme', isDark ? 'light' : 'dark');

        // 切换主题时重新渲染 Mermaid 图表
        if (typeof mermaid !== 'undefined') {
            const mermaidFont = '"Open Sans", "PingFang SC", "Microsoft YaHei", sans-serif';
            const mermaidTheme = isDark ? 'default' : 'dark';
            document.querySelectorAll('.mermaid').forEach(el => {
                el.removeAttribute('data-processed');
                el.innerHTML = el.getAttribute('data-original');
            });
            mermaid.initialize({ startOnLoad: false, theme: mermaidTheme, themeVariables: { fontFamily: mermaidFont } });
            mermaid.run();
        }
    });

    // ── 同步滚动（窄屏上下两栏时启用） ──────────────
    function setupSyncScroll() {
        const sourceScroll = document.querySelector('.source-panel .panel-scroll');
        const renderScroll = document.querySelector('.render-panel .panel-scroll');
        let leader = null;
        let resetTimer;
        function scheduleReset() {
            clearTimeout(resetTimer);
            resetTimer = setTimeout(() => leader = null, 100);
        }
        sourceScroll.addEventListener('scroll', () => {
            if (leader === 'render') return;
            leader = 'source';
            scheduleReset();
            const ratio = sourceScroll.scrollTop / (sourceScroll.scrollHeight - sourceScroll.clientHeight || 1);
            renderScroll.scrollTop = ratio * (renderScroll.scrollHeight - renderScroll.clientHeight);
        });
        renderScroll.addEventListener('scroll', () => {
            if (leader === 'source') return;
            leader = 'render';
            scheduleReset();
            const ratio = renderScroll.scrollTop / (renderScroll.scrollHeight - renderScroll.clientHeight || 1);
            sourceScroll.scrollTop = ratio * (sourceScroll.scrollHeight - sourceScroll.clientHeight);
        });
    }

    // 窄屏（≤600px）时启用同步滚动，宽屏时由容器统一滚动无需同步
    const mql = window.matchMedia('(max-width: 600px)');
    if (mql.matches) setupSyncScroll();
    mql.addEventListener('change', () => { if (mql.matches) setupSyncScroll(); });

    // ── 剥离 <pre> 内容中的 HTML 源码缩进 ──────────
    document.querySelectorAll('pre[data-indent]').forEach(pre => {
        const spaces = parseInt(pre.dataset.indent) * 4;
        const prefix = ' '.repeat(spaces);
        pre.innerHTML = pre.innerHTML.split('\n').map(line => {
            if (line.startsWith(prefix)) return line.slice(spaces);
            return line;
        }).join('\n');
    });

    // ── 页面内跳转：定位到 panel-title 下方 ─────────
    const container = document.querySelector('.container');
    const renderScroll = document.querySelector('.render-panel .panel-scroll');
    const isNarrow = () => window.innerWidth <= 600;

    document.querySelectorAll('.post-body a[href^="#"]').forEach(link => {
        link.addEventListener('click', e => {
            const id = link.getAttribute('href').slice(1);
            const target = document.getElementById(decodeURIComponent(id));
            if (target) {
                e.preventDefault();
                const narrow = isNarrow();
                const scrollEl = narrow ? renderScroll : container;
                const offset = narrow ? 0 : document.querySelector('.render-panel .panel-title').getBoundingClientRect().height;
                const targetTop = scrollEl.scrollTop + target.getBoundingClientRect().top - scrollEl.getBoundingClientRect().top - offset;
                scrollEl.scrollTo({ behavior: 'smooth', top: targetTop });
            }
        });
    });
</script>
</body>
</html>
